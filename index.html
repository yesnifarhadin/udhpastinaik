<style amp-custom>

    :root{
      --rv-bg:#050505;
      --rv-panel:#111111;
      --rv-wine:#1a1a1a;

      --rv-ruby:#d4af37;
      --rv-red:#f2c94c;
      --rv-hot:#ffd76a;
      --rv-blue:#b88916;

      --rv-pink:#e3e6e8;
      --rv-text:#f7f7f5;
      --rv-muted:#a8adb2;

      --rv-line:rgba(212,175,55,.42)
    }

    *{
      box-sizing:border-box
    }

    html{
      background:var(--rv-bg)
    }

    body{
      position:relative;
      display:flex;
      align-items:flex-start;
      justify-content:center;

      width:100%;

      min-height:100vh;
      min-height:100svh;

      margin:0;

      padding:
        18px
        9px
        calc(18px + env(safe-area-inset-bottom));

      overflow-x:hidden;

      color:var(--rv-text);

      background:
        radial-gradient(
          circle at 50% -10%,
          #5a430d 0%,
          #1a1508 29%,
          #070707 58%,
          #020202 100%
        );

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif
    }

    body::before{
      content:"";

      position:fixed;

      inset:0;

      z-index:0;

      pointer-events:none;

      background:

        repeating-linear-gradient(
          135deg,
          transparent 0 19px,
          rgba(255,255,255,.015) 19px 21px
        ),

        radial-gradient(
          circle at 10% 25%,
          rgba(212,175,55,.12),
          transparent 27%
        ),

        radial-gradient(
          circle at 90% 75%,
          rgba(192,192,192,.10),
          transparent 30%
        )
    }

    .rv-amp-stage{
      position:relative;

      z-index:1;

      width:100%;

      max-width:470px;

      margin:auto
    }

    /* =========================
       MAIN BLACK GOLD PANEL
       ========================= */

    .rv-vault-shell{
      position:relative;

      isolation:isolate;

      overflow:hidden;

      background:
        linear-gradient(
          155deg,
          rgba(25,25,25,.98),
          rgba(5,5,5,.99) 48%,
          rgba(18,18,18,.98)
        );

      border:
        1px solid var(--rv-line);

      border-radius:26px;

      box-shadow:

        0 24px 60px rgba(0,0,0,.72),

        0 0 38px rgba(212,175,55,.22),

        inset 0 1px 0 rgba(255,255,255,.13),

        inset 0 -15px 30px rgba(0,0,0,.32)
    }

    /* GOLD LIGHT TOP */

    .rv-vault-shell::before{
      content:"";

      position:absolute;

      top:0;

      left:8%;

      right:8%;

      z-index:4;

      height:2px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--rv-hot),
          #f3f3f3,
          var(--rv-hot),
          transparent
        );

      filter:
        drop-shadow(
          0 0 7px var(--rv-red)
        );

      animation:
        rvTopPulse
        3s
        ease-in-out
        infinite
    }

    /* SILVER LIGHT SWEEP */

    .rv-vault-shell::after{
      content:"";

      position:absolute;

      top:-60%;

      left:-55%;

      z-index:3;

      width:32%;

      height:220%;

      pointer-events:none;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.04),
          rgba(255,255,255,.20),
          rgba(255,255,255,.04),
          transparent
        );

      transform:
        rotate(22deg);

      animation:
        rvVaultSweep
        7s
        ease-in-out
        infinite
    }

    /* =========================
       HEADER
       ========================= */

    .rv-vault-top{
      position:relative;

      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:10px;

      padding:
        13px
        15px;

      background:
        linear-gradient(
          180deg,
          rgba(35,29,15,.96),
          rgba(7,7,7,.98)
        );

      border-bottom:
        1px solid rgba(212,175,55,.30);

      box-shadow:
        inset 0 -8px 16px rgba(0,0,0,.24);

      font-family:
        Manrope,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      font-size:9px;

      font-weight:800;

      letter-spacing:.35px;

      text-transform:uppercase
    }

    .rv-vault-mark{
      display:flex;

      align-items:center;

      gap:8px;

      color:var(--rv-pink)
    }

    /* GOLD SILVER DIAMOND */

    .rv-vault-gem{
      width:11px;

      height:11px;

      background:
        linear-gradient(
          145deg,
          #f2f2f2,
          var(--rv-ruby)
        );

      border:
        1px solid rgba(232,232,232,.88);

      transform:
        rotate(45deg);

      box-shadow:
        0 0 12px rgba(212,175,55,.72);

      animation:
        rvGemPulse
        2.2s
        ease-in-out
        infinite
    }

    .rv-vault-status{
      display:flex;

      align-items:center;

      gap:6px;

      color:#fff
    }

    .rv-vault-status::before{
      content:"";

      width:7px;

      height:7px;

      background:#d4af37;

      border-radius:50%;

      box-shadow:
        0 0 9px rgba(212,175,55,.88);

      animation:
        rvStatusBlink
        1.5s
        ease-in-out
        infinite
    }

    /* =========================
       BODY
       ========================= */

    .rv-vault-body{
      position:relative;

      padding:18px
    }

    .rv-brand-lockup{
      width:100%;

      max-width:215px;

      margin:
        0 auto 10px
    }

    .rv-brand-lockup amp-img{
      filter:
        drop-shadow(
          0 0 14px rgba(212,175,55,.34)
        )
    }

    /* =========================
       SUBTITLE
       ========================= */

    .rv-kicker{
      position:relative;

      margin:
        12px 0 17px;

      color:var(--rv-pink);

      font-family:
        Manrope,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      font-size:10px;

      font-weight:800;

      line-height:1.6;

      letter-spacing:.35px;

      text-align:center;

      text-transform:uppercase;

      text-shadow:
        0 0 10px rgba(212,175,55,.30)
    }

    .rv-kicker::before,
    .rv-kicker::after{
      content:"◆";

      display:inline-block;

      margin:
        0 8px;

      color:var(--rv-hot);

      font-size:8px;

      transform:
        rotate(45deg)
    }

    /* =========================
       HERO BANNER
       ========================= */

    .rv-hero-card{
      position:relative;

      padding:5px;

      overflow:hidden;

      background:
        linear-gradient(
          145deg,
          rgba(212,175,55,.20),
          rgba(18,18,18,.60)
        );

      border:
        1px solid rgba(212,175,55,.52);

      border-radius:18px;

      box-shadow:

        0 14px 30px rgba(0,0,0,.48),

        0 0 24px rgba(212,175,55,.18),

        inset 0 1px 0 rgba(230,230,230,.16)
    }

    .rv-hero-card::before,
    .rv-hero-card::after{
      content:"";

      position:absolute;

      z-index:2;

      width:33px;

      height:33px;

      pointer-events:none
    }

    .rv-hero-card::before{
      top:9px;

      left:9px;

      border-top:
        2px solid var(--rv-hot);

      border-left:
        2px solid var(--rv-hot);

      border-radius:
        7px 0 0
    }

    .rv-hero-card::after{
      right:9px;

      bottom:9px;

      border-right:
        2px solid var(--rv-hot);

      border-bottom:
        2px solid var(--rv-hot);

      border-radius:
        0 0 7px
    }

    .rv-hero-media{
      position:relative;

      overflow:hidden;

      border-radius:13px
    }

    .rv-hero-media amp-img{
      display:block
    }

    /* GOLD SCANNER */

    .rv-hero-scan{
      position:absolute;

      top:-20%;

      left:0;

      z-index:2;

      width:100%;

      height:18%;

      pointer-events:none;

      background:
        linear-gradient(
          180deg,
          transparent,
          rgba(212,175,55,.18),
          rgba(230,230,230,.16),
          transparent
        );

      filter:
        blur(1px);

      animation:
        rvScanMove
        4.2s
        linear
        infinite
    }

    /* =========================
       FEATURE STRIP
       ========================= */

    .rv-feature-strip{
      display:grid;

      grid-template-columns:
        repeat(3,minmax(0,1fr));

      gap:6px;

      margin:
        12px 0 15px
    }

    .rv-feature-chip{
      position:relative;

      padding:
        8px 3px;

      color:#f7f7f5;

      background:
        linear-gradient(
          145deg,
          rgba(212,175,55,.12),
          rgba(15,15,15,.72)
        );

      border:
        1px solid rgba(212,175,55,.22);

      border-radius:9px;

      font-family:
        Manrope,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      font-size:8px;

      font-weight:700;

      letter-spacing:.1px;

      text-align:center;

      text-transform:uppercase
    }

    .rv-feature-chip::before{
      content:"";

      position:absolute;

      top:4px;

      left:50%;

      width:18px;

      height:1px;

      background:
        var(--rv-hot);

      box-shadow:
        0 0 5px var(--rv-hot);

      transform:
        translateX(-50%)
    }

    /* =========================
       BUTTON AREA
       ========================= */

    .rv-access-list{
      display:flex;

      flex-direction:column;

      gap:10px
    }

    .rv-access-btn{
      position:relative;

      display:grid;

      grid-template-columns:
        36px 1fr 24px;

      align-items:center;

      min-height:54px;

      padding:
        8px 13px;

      overflow:hidden;

      color:#fff;

      text-decoration:none;

      text-transform:uppercase;

      border:
        1px solid transparent;

      border-radius:13px;

      box-shadow:

        inset 0 1px 0 rgba(255,255,255,.17),

        inset 0 -8px 15px rgba(0,0,0,.25),

        0 8px 17px rgba(0,0,0,.34);

      font-family:
        Manrope,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      font-size:12px;

      font-weight:800;

      letter-spacing:.45px;

      text-shadow:
        0 2px 5px rgba(0,0,0,.45);

      transition:
        filter .2s ease,
        transform .2s ease
    }

    /* SILVER GLASS */

    .rv-access-btn::before{
      content:"";

      position:absolute;

      top:1px;

      left:4%;

      width:92%;

      height:35%;

      pointer-events:none;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.20),
          rgba(255,255,255,.04),
          transparent
        );

      border-radius:
        10px 10px 40% 40%
    }

    .rv-access-btn::after{
      content:"";

      position:absolute;

      top:-90%;

      left:-55%;

      width:30%;

      height:280%;

      pointer-events:none;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.08),
          rgba(255,255,255,.42),
          rgba(255,255,255,.08),
          transparent
        );

      transform:
        rotate(22deg);

      animation:
        rvButtonShine
        4.8s
        ease-in-out
        infinite
    }

    /* LOGIN - BLACK SILVER */

    .rv-access-login{
      background:
        linear-gradient(
          145deg,
          #080808 0%,
          #2a2a2a 52%,
          #030303 100%
        );

      border-color:#9f8745;

      color:#e3e6e8;

      box-shadow:

        inset 0 1px 0 rgba(255,255,255,.15),

        inset 0 -8px 15px rgba(0,0,0,.35),

        0 8px 18px rgba(0,0,0,.40),

        0 0 15px rgba(212,175,55,.12)
    }

    /* REGISTER - GOLD */

    .rv-access-register{
      background:
        linear-gradient(
          145deg,
          #ffe9a3 0%,
          #d4af37 48%,
          #8a6612 100%
        );

      border-color:#f2de9a;

      color:#111111;

      text-shadow:
        0 2px 5px rgba(55,38,0,.28);

      box-shadow:

        inset 0 1px 0 rgba(255,255,255,.40),

        inset 0 -8px 15px rgba(82,56,0,.28),

        0 9px 19px rgba(151,108,12,.36),

        0 0 20px rgba(212,175,55,.30)
    }

    /* LINK ALTERNATIF - SILVER */

    .rv-access-alt{
      background:
        linear-gradient(
          145deg,
          #d7d9dc 0%,
          #777b80 52%,
          #232323 100%
        );

      border-color:#ececec;

      color:#f7f7f5;

      box-shadow:

        inset 0 1px 0 rgba(255,255,255,.22),

        inset 0 -8px 15px rgba(0,0,0,.30),

        0 9px 19px rgba(0,0,0,.40),

        0 0 18px rgba(220,220,220,.14)
    }

    .rv-btn-index{
      position:relative;

      z-index:2;

      display:flex;

      align-items:center;

      justify-content:center;

      width:30px;

      height:30px;

      color:inherit;

      background:
        rgba(0,0,0,.30);

      border:
        1px solid rgba(225,225,225,.30);

      border-radius:9px;

      font-size:9px;

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12)
    }

    .rv-btn-label{
      position:relative;

      z-index:2;

      text-align:center
    }

    .rv-btn-arrow{
      position:relative;

      z-index:2;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      font-size:24px;

      font-weight:400;

      text-align:right;

      transition:
        transform .2s ease
    }

    .rv-access-btn:hover{
      filter:
        brightness(1.1);

      transform:
        translateY(-2px)
    }

    .rv-access-btn:hover .rv-btn-arrow{
      transform:
        translateX(3px)
    }

    .rv-access-btn:active{
      transform:
        scale(.98)
    }

    /* =========================
       FOOTER
       ========================= */

    .rv-vault-footer{
      position:relative;

      padding:
        13px 12px;

      color:var(--rv-muted);

      background:
        linear-gradient(
          180deg,
          rgba(25,25,25,.96),
          rgba(4,4,4,.99)
        );

      border-top:
        1px solid rgba(212,175,55,.27);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      font-size:8px;

      font-weight:600;

      letter-spacing:.25px;

      text-align:center;

      text-transform:uppercase
    }

    /* =========================
       OPENING SCREEN
       ========================= */

    .rv-opening{
      position:absolute;

      inset:0;

      z-index:10;

      display:flex;

      align-items:center;

      justify-content:center;

      overflow:hidden;

      pointer-events:none;

      background:#050505;

      animation:
        rvOpeningHide
        .7s
        cubic-bezier(.22,1,.36,1)
        2.35s
        forwards
    }

    .rv-opening::before,
    .rv-opening::after{
      content:"";

      position:absolute;

      top:0;

      bottom:0;

      width:51%;

      background:

        radial-gradient(
          circle at center,
          rgba(212,175,55,.24),
          transparent 55%
        ),

        linear-gradient(
          145deg,
          #3a2d0e,
          #111111 58%,
          #030303
        );

      box-shadow:
        inset 0 0 30px rgba(212,175,55,.12);

      animation-duration:.85s;

      animation-timing-function:
        cubic-bezier(.77,0,.18,1);

      animation-delay:1.75s;

      animation-fill-mode:forwards
    }

    .rv-opening::before{
      left:0;

      border-right:
        1px solid rgba(212,175,55,.40);

      animation-name:
        rvPanelLeft
    }

    .rv-opening::after{
      right:0;

      border-left:
        1px solid rgba(212,175,55,.40);

      animation-name:
        rvPanelRight
    }

    .rv-opening-center{
      position:relative;

      z-index:3;

      display:flex;

      flex-direction:column;

      align-items:center;

      justify-content:center
    }

    /* GOLD SILVER OPENING SEAL */

    .rv-opening-seal{
      position:relative;

      width:72px;

      height:72px;

      margin-bottom:24px;

      opacity:0;

      transform:
        rotate(45deg) scale(.15);

      background:
        linear-gradient(
          145deg,
          #f2f2f2,
          #d4af37 48%,
          #6f5210
        );

      border:
        2px solid #f2de9a;

      box-shadow:

        0 0 0 7px rgba(212,175,55,.08),

        0 0 35px rgba(212,175,55,.62),

        inset 0 1px 0 rgba(255,255,255,.35),

        inset 0 -9px 18px rgba(73,52,5,.34);

      animation:
        rvSealReveal
        1.05s
        cubic-bezier(.22,1,.36,1)
        .1s
        forwards
    }

    .rv-opening-seal::before{
      content:"L";

      position:absolute;

      top:50%;

      left:50%;

      color:#111111;

      background:transparent;

      font-family:
        Arial,
        sans-serif;

      font-size:32px;

      font-weight:900;

      line-height:1;

      transform:
        translate(-50%,-50%)
        rotate(135deg);

      transform-origin:center
    }

    .rv-opening-seal::after{
      display:none
    }

    /* OPENING BRAND */

    .rv-opening-brand{
      position:relative;

      overflow:hidden;

      color:#ffd76a;

      font-family:
        Manrope,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      font-size:25px;

      font-weight:800;

      line-height:1;

      letter-spacing:4px;

      text-align:center;

      text-shadow:

        0 0 17px rgba(212,175,55,.72),

        0 4px 14px rgba(0,0,0,.55);

      opacity:0;

      transform:
        translateY(18px);

      animation:
        rvBrandReveal
        .75s
        cubic-bezier(.22,1,.36,1)
        .7s
        forwards
    }

    .rv-opening-brand::after{
      content:"";

      position:absolute;

      top:0;

      bottom:0;

      left:-55%;

      width:30%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.85),
          transparent
        );

      transform:
        skewX(-18deg);

      animation:
        rvBrandShine
        .75s
        ease
        1.18s
        forwards
    }

    .rv-opening-line{
      width:0;

      height:2px;

      margin-top:15px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--rv-hot),
          #ffffff,
          var(--rv-hot),
          transparent
        );

      box-shadow:
        0 0 11px rgba(212,175,55,.72);

      animation:
        rvLineExpand
        .65s
        ease
        1s
        forwards
    }

    .rv-opening-subtitle{
      margin-top:10px;

      color:#c8cacc;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      font-size:9px;

      65%{

        transform:
          rotate(225deg)

      }

      100%{

          scale(1)
      }
    }

    @keyframes rvLineExpand{

    }

    @keyframes rvSubtitleReveal{

      }
    }

    @keyframes rvPanelLeft{

          translateX(-105%)
      }
    }

    @keyframes rvPanelRight{

          translateX(105%)
      }
    }

    @keyframes rvOpeningHide{
